services:
  - type: web
    name: cerberus-soc
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_TOKEN
        generateValue: true
      - key: INGEST_TOKENS
        value: change-me-ingest-token
      - key: PUBLIC_BASE_URL
        value: ""   # set to your custom domain after pointing DNS, e.g. https://soc.yourdomain.com
      - key: DATA_DIR
        value: /tmp/cerberus-data   # free tier has ephemeral disk; use a Render disk in production
      - key: AUTO_SEED
        value: "true"   # rebuild demo dataset after cold start (ephemeral disk)
      - key: PUBLIC_MODE
        value: "true"   # visitors can view incidents/locations/reports without a token
      - key: ALLOWED_ORIGINS
        value: "*"   # browser clients may call this API from any origin (fine for public demo).
                     # For production, list your domains instead, e.g.:
                     # https://soc.yourdomain.com,https://soc-frontend.onrender.com,https://<user>.github.io
